name: recruitment-project
services:
  app:
    image: recruitment-chatbot:local
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: .env
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8502}:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./artifacts:/app/artifacts
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
