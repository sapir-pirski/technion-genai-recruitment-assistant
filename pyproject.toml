[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-chatbot"
version = "0.1.0"
description = "LangGraph recruitment assistant with RAG and transactional scheduling"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
recruitment = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "streamlit_app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "ingestion/fonts/*.ttf", "ingestion/fonts/*.txt"]
streamlit_app = ["styles.css", "page_actions.js", "ui_behaviors.js"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app/streamlit_main.py" = ["E402"]
"tests/*.ipynb" = ["E402"]
